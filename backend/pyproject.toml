[project]
name = "wordagent-frontend-api"
version = "0.1.0"
description = "Frontend-facing API bridge inspired by WordAgent, for bidding document workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.0",
    "PyMuPDF>=1.24.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pymysql>=1.1.0",
    "qdrant-client>=1.12.0,<2.0.0",
]

[project.optional-dependencies]
knowledge = [
    "Pillow>=10.0.0",
    "paddleocr>=2.7.0",
]
milvus = [
    "pymilvus>=2.5.0",
]
qdrant = [
    "qdrant-client>=1.12.0,<2.0.0",
]

[tool.uv]
package = false
