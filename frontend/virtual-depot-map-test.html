<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚拟配送中心地图测试</title><style>body{margin:0;font:15px system-ui,'Microsoft YaHei',sans-serif;background:#f4f6f3;color:#243129}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d9e3da}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;line-height:1.6}.warning{color:#a45315;font-weight:bold}.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px}.panel{background:white;border-radius:10px;padding:16px;max-height:76vh;overflow:auto}#map{height:76vh;min-height:500px;border-radius:10px}.item{padding:9px 0;border-bottom:1px solid #eee}.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#28764a;color:white;border:2px solid white;border-radius:50%;font-size:12px;font-weight:700;box-shadow:0 1px 4px #555}.dest{background:#bc432c}.selected{background:#df9b16;box-shadow:0 0 0 4px #ffe6a0}.error{color:#b51b16}@media(max-width:760px){.wrap{grid-template-columns:1fr}.panel{max-height:220px}#map{height:60vh}}</style></head><body><header><h1>20 个虚拟配送中心 · 高德路线测试</h1><p class="warning">全部位置均为虚构测试坐标，不代表企业真实网点，路线不可用于实际配送或投标。</p><p>绿色编号为虚拟配送中心，红色标记为虚拟需求点；金色编号为道路距离最短的中心，蓝色线为其驾车路线。</p></header><div class="wrap"><aside class="panel"><strong>20 个网点道路距离排名</strong><div id="summary"></div><h3>虚拟中心</h3><div id="list"></div><div id="error" class="error"></div></aside><div id="map"></div></div><script type="module" src="/virtual-depot-map-test.ts"></script></body></html>
